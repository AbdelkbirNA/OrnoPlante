name: E2E Tests

on:
  pull_request:
    branches: [main]   # seulement sur les PR vers main
  workflow_dispatch:    # déclenchement manuel possible

jobs:
  e2e:
    runs-on: ubuntu-latest

    # Service MySQL pour le backend
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: ornoplante
          MYSQL_USER: user
          MYSQL_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    # Définir DATABASE_URL pour tout le job depuis les secrets
    env:
      DATABASE_URL: mysql://root:root@localhost:3306/ornoplante
      MYSQLHOST: localhost
      MYSQLUSER: root
      MYSQLPASSWORD: root
      MYSQLDATABASE: ornoplante
      MYSQLPORT: 3306

    steps:
      # Récupérer le code
      - uses: actions/checkout@v3

      # Installer Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20

      # Installer dépendances backend
      - name: Install backend dependencies
        run: npm install
        working-directory: backend

      - name: Wait for MySQL
        run: |
          until nc -zv localhost 3306; do
            echo "Waiting for MySQL..."
            sleep 2
          done
      - name: Prisma DB Push
        run: npx prisma db push
        working-directory: backend
        
      # Lancer backend en arrière-plan
      - name: Start backend
        run: npm run start &
        working-directory: backend

      # Installer dépendances frontend
      - name: Install frontend dependencies
        run: npm install
        working-directory: frontend
      
      - name: Start frontend
        run: npm run dev &
        working-directory: frontend
      # Lancer tests E2E avec Cypress
      - name: Run Cypress tests
        uses: cypress-io/github-action@v5
        with:
          runTests: true
          browser: chrome
          headed: false 
          working-directory: frontend  # <- ici aussi, pour que Cypress se lance dans le bon dossier
