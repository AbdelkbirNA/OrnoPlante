name: E2E Tests

# Quand le workflow se déclenche
on:
  pull_request:
    branches: [main]   # seulement sur les PR vers main
  workflow_dispatch:    # optionnel : déclenchement manuel

jobs:
  e2e:
    runs-on: ubuntu-latest

    # Service MySQL pour le backend
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: ornoplante
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
      # Récupération du code
      - uses: actions/checkout@v3

      # Installer Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20

      # Installer dépendances backend
      - name: Install backend dependencies
        run: npm install
        working-directory: backend

      # Lancer backend (en background si nécessaire)
      - name: Start backend
        run: npm run start &
        working-directory: backend

      # Installer dépendances frontend (optionnel si E2E nécessite)
      - name: Install frontend dependencies
        run: npm install
        working-directory: frontend
      

      # Lancer tests E2E
      - name: Run Cypress E2E tests
        uses: cypress-io/github-action@v5
        with:
          browser: chrome
          headless: true