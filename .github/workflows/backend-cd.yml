name: CD Backend

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'prisma/**'
  workflow_dispatch: # permet de lancer manuellement le déploiement si besoin

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker image
        run: docker build -t abdelkbirna/ornoplante-backend:latest -f ./backend/Dockerfile.prod ./backend

      - name: Push Docker image
        run: docker push abdelkbirna/ornoplante-backend:latest
